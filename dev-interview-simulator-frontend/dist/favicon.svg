<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Même mark que la navbar (src/components/common/LogoMark.tsx) :
       bulle de dialogue + chevron « > » + curseur. Un favicon est un document
       statique : il ne peut pas lire les var() CSS de l'app, d'où les valeurs
       codées en dur de la palette « soleil » (défaut) :
       brand #123C69 · nav #FFD23F · accent #FF5A36. -->
  <!-- Corps de la bulle -->
  <rect x="6" y="8" width="52" height="38" rx="12" fill="#123C69"/>
  <!-- Queue de la bulle -->
  <path d="M16 44 L14 58 L30 46 Z" fill="#123C69"/>
  <!-- Chevron « > » du terminal -->
  <path d="M22 19 L32 27 L22 35" fill="none" stroke="#FFD23F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trait du curseur (accent) -->
  <path d="M36 35 H46" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round"/>
</svg>
