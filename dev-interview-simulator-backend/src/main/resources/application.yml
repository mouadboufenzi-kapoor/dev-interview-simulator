spring:
  application:
    name: dev-interview-simulator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dev_interview_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

server:
  port: ${PORT:8080}

app:
  cors:
    # Origines du frontend autorisees (virgules) — a surcharger en prod via CORS_ORIGINS.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  security:
    jwt:
      # Pas de fallback : le demarrage echoue explicitement si JWT_SECRET est absent
      # (evite de signer les tokens avec une valeur publique connue en prod).
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT8H}
    # Client ID OAuth Web (Google Cloud Console) — requis pour /api/auth/google.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  admin:
    # Pas de fallback admin/admin : le demarrage echoue explicitement si ces
    # variables sont absentes (elles sont fournies par le .env via docker-compose).
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  generation:
    # Generation LLM des questions (admin). Sans cle, la fonctionnalite repond
    # 503 sans appel au fournisseur ; l'application demarre normalement.
    enabled: ${GENERATION_ENABLED:true}
    # Fournisseur LLM actif (defaut : gemini). Une valeur inconnue fait echouer
    # le demarrage avec un message clair ; aucun basculement automatique.
    provider: ${GENERATION_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # Modele surchargeable sans rebuild via GEMINI_MODEL (son existence dans
      # le compte du fournisseur est a verifier au moment de l'usage).
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      models: ${GEMINI_MODELS:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      # Idem pour Groq (virgules) : modele par defaut GROQ_MODEL + modeles selectionnables.
      models: ${GROQ_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}